<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Eagle Flight</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;height:var(--vh,100dvh);overflow:hidden;background:#000;position:fixed;inset:0}#c{position:fixed;inset:0;width:100%;height:var(--vh,100dvh)}html,body,#c{margin:0;overflow:hidden;background:#000;font-family:system-ui,sans-serif;touch-action:none}
#banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:10px 18px;border-radius:12px;font-size:17px;text-align:center;z-index:5}
#search{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:4px}
#search input{padding:8px;border-radius:8px;border:0;width:200px}#search button{padding:8px 12px;border-radius:8px;border:0}
#hud{display:none}
#joy{position:absolute;left:calc(24px + env(safe-area-inset-left));bottom:calc(24px + env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);z-index:5}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.8)}
.btn{position:absolute;bottom:30px;width:84px;height:84px;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:800;font-size:15px;z-index:5;user-select:none;-webkit-user-select:none}
#hover{right:20px;bottom:126px;width:72px;height:72px;font-size:13px;background:rgba(40,120,200,.8)}#hover.on{background:rgba(40,200,120,.9);box-shadow:0 0 14px #4f8}#score{position:absolute;top:calc(52px + env(safe-area-inset-top));left:calc(58px + env(safe-area-inset-left));color:#fff;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:8px;font:600 13px system-ui;z-index:5}#arrow.carry{background:rgba(255,190,0,.9);color:#000;box-shadow:0 0 18px #ffd000;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.08)}}#toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);color:#fff;font:800 26px system-ui;text-shadow:0 0 6px #000;opacity:0;transition:opacity .4s;z-index:6;pointer-events:none;white-space:nowrap}#boost{right:120px;background:rgba(255,120,0,.75)}#poop{right:20px;background:rgba(120,80,40,.8);font-size:30px}
#quitc{display:none;position:absolute;top:calc(90px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));background:rgba(200,30,30,.9);color:#fff;padding:6px 10px;border-radius:8px;font:700 14px system-ui;z-index:6}#quit{position:absolute;top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:rgba(200,30,30,.85);color:#fff;font:800 20px system-ui;z-index:6}#stats{position:absolute;top:calc(14px + env(safe-area-inset-top));left:calc(58px + env(safe-area-inset-left));color:#fff;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:8px;z-index:5;font-size:14px}
#arrow{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));color:#fff;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:8px;z-index:5;font-size:14px;text-align:center}
#arrow span{display:inline-block;font-size:26px}
#credits{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);color:#ddd;font-size:10px;z-index:5;text-shadow:0 0 2px #000;pointer-events:none}#credits a{pointer-events:auto}@media (max-width:700px){#credits{bottom:206px;width:90%;text-align:center;font-size:9px}}
.boosting{box-shadow:inset 0 0 120px 30px rgba(255,200,80,.5)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:4}
</style></head><body>
<div id="c"></div><div id="fx"></div>
<div id="banner">🦅 Tap anywhere on Earth to build your eagle's nest<br><small>zoom in for precision (pinch / scroll)</small></div>
<div id="search"><input id="q" placeholder="Search a place…"><button id="go">Go</button></div>
<div id="hud"><button id="quit" title="End flight">✕</button><div id="quitc">Tap ✕ again to end flight</div><div id="stats"></div><div id="arrow">Nest<br><span>⬆</span><br><b id="dist"></b></div>
<div id="joy"><div id="knob"></div></div>
<button class="btn" id="boost">BOOST</button><button class="btn" id="poop">💩</button><button class="btn" id="hover">HOVER</button><div id="toast"></div><div id="score"></div></div>
<div id="credits">Imagery © Esri, Maxar, Earthstar Geographics · Google 3D Tiles / Cesium ion · Eagle: <a style="color:#ddd" href="https://sketchfab.com/3d-models/bald-eagle-8874cfcf83a54575ba8068376f8a63a8" target="_blank">"Bald Eagle" by ucdavisterc (CC-BY)</a> · Nest: procedural</div>
<script src="config.js" onerror="0"></script><script src="game.js"></script></body></html>
<style>#boost,#poop{bottom:calc(30px + env(safe-area-inset-bottom))}#boost{right:calc(120px + env(safe-area-inset-right))}#poop{right:calc(20px + env(safe-area-inset-right))}#hover{right:calc(20px + env(safe-area-inset-right));bottom:calc(126px + env(safe-area-inset-bottom))}@media (max-height:500px){#credits{bottom:4px;left:50%;width:34%;transform:translateX(-50%)}#hover{right:calc(210px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom))}}</style>
