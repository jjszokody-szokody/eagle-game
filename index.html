<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Eagle Flight</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
html,body,#c{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;touch-action:none}
#banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:10px 18px;border-radius:12px;font-size:17px;text-align:center;z-index:5}
#search{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:4px}
#search input{padding:8px;border-radius:8px;border:0;width:200px}#search button{padding:8px 12px;border-radius:8px;border:0}
#hud{display:none}
#joy{position:absolute;left:24px;bottom:24px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.5);z-index:5}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.8)}
.btn{position:absolute;bottom:30px;width:84px;height:84px;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:800;font-size:15px;z-index:5;user-select:none;-webkit-user-select:none}
#boost{right:120px;background:rgba(255,120,0,.75)}#poop{right:20px;background:rgba(120,80,40,.8);font-size:30px}
#stats{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:8px;z-index:5;font-size:14px}
#arrow{position:absolute;top:10px;right:10px;color:#fff;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:8px;z-index:5;font-size:14px;text-align:center}
#arrow span{display:inline-block;font-size:26px}
#credits{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);color:#ddd;font-size:10px;z-index:5;text-shadow:0 0 2px #000;pointer-events:none}#credits a{pointer-events:auto}@media (max-width:700px){#credits{bottom:130px;width:90%;text-align:center;font-size:9px}}
.boosting{box-shadow:inset 0 0 120px 30px rgba(255,200,80,.5)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:4}
</style></head><body>
<div id="c"></div><div id="fx"></div>
<div id="banner">🦅 Tap anywhere on Earth to build your eagle's nest<br><small>zoom in for precision (pinch / scroll)</small></div>
<div id="search"><input id="q" placeholder="Search a place…"><button id="go">Go</button></div>
<div id="hud"><div id="stats"></div><div id="arrow">Nest<br><span>⬆</span><br><b id="dist"></b></div>
<div id="joy"><div id="knob"></div></div>
<button class="btn" id="boost">BOOST</button><button class="btn" id="poop">💩</button></div>
<div id="credits">Imagery © Esri, Maxar, Earthstar Geographics · Google 3D Tiles / Cesium ion · Eagle: <a style="color:#ddd" href="https://sketchfab.com/3d-models/white-eagle-animation-fast-fly-30203bf39e5145f19c79e83c550139d3" target="_blank">White Eagle Animation Fast Fly by GremorySaiyan (CC-BY)</a> · Nest: procedural</div>
<script src="config.js" onerror="0"></script><script src="game.js"></script></body></html>
